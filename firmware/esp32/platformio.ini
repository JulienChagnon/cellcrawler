; ESP32 truck controller. Build/flash: `pio run -t upload` from this directory.
[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 921600
upload_speed = 921600
; Shared protocol headers (common/fpv/*). symlink:// copes with spaces in the path.
lib_deps = symlink://../../common
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
